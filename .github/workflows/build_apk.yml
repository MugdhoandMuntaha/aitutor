name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > aitutor/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> aitutor/android/local.properties

      - name: Install Flutter Dependencies
        run: |
          cd aitutor
          flutter pub get

      - name: Analyze Project
        run: |
          cd aitutor
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android Release APK
        run: |
          cd aitutor
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_Release_APK
          path: aitutor/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

